<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Hub v89 | Play/Pause buttons functionality via bridge</title>
    <link rel="stylesheet" href="style_v89.css">
   
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="tv-meta tv-off"> 
    </div>
    <div id="slide-1" class="slide-container active">
        <div id="blur-1" class="blur-bg"></div>
        <div id="sharp-1" class="sharp-img"></div>
    </div>
    <div id="slide-2" class="slide-container">
        <div id="blur-2" class="blur-bg"></div>
        <div id="sharp-2" class="sharp-img"></div>
    </div>
    
    <div class="overlay"></div>

    <div id="debug-log" style="display: none; position: fixed; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #ff0055; border-radius: 8px; max-height: 50vh; overflow-y: auto; font-family: monospace; font-size: 12px; pointer-events: none;"></div>
    
    <div class="top-bar">
        <div id="temp-drawer-btn" onclick="toggleTopDrawer()">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </div>
        <div id="super-widget" class="top-drawer-content">
            <div id="temp" onclick="toggleDebug()">--°</div>
            <div id="weather-desc">...</div> 
            <div id="widget-clock" onclick="window.toggleDebug()" style="cursor: pointer;">--:--</div>
            <div id="photo-desc">...</div>
            <div id="photo-date">...</div>     
        </div>
    </div>

    <div id="ai-feedback"></div>

    <div id="drawer-container">
        <div id="control-drawer" class="hidden">
            <div id="drawer-toggle" onclick="toggleDrawer()">◀</div>

            <div class="drawer-content-wrapper" style="display: flex; flex-direction: row; gap: 30px; align-items: flex-start;">
                
                <div class="covers-container" style="display: flex; flex-direction: column; gap: 15px;">
                    
                    <div class="rooms-grid" style="display: flex; gap: 20px;">
                        <div class="room-column" data-room="kid">
                            <div class="room-label">Kid</div>
                            <div class="progress-track" onclick="App.seek(event, 'kid')" style="cursor:pointer; position:relative;">
                                <div id="prog-kid" class="progress-fill"></div>
                                <div id="target-kid" class="target-line"></div>
                            </div>
                            <div class="btn-group">
                                <button class="ghost-btn" onclick="App.cover('kid','Open')">▲</button>
                                <button class="ghost-btn" onclick="App.cover('kid','Close')">▼</button>
                            </div>
                        </div>
                        <div class="room-column" data-room="tv_area">
                            <div class="room-label">TV Area</div>
                            <div class="progress-track" onclick="App.seek(event, 'tv_area')" style="cursor:pointer; position:relative;">
                                <div id="prog-tv_area" class="progress-fill"></div>
                                <div id="target-tv_area" class="target-line"></div>
                            </div>
                            <div class="btn-group">
                                <button class="ghost-btn" onclick="App.cover('tv_area','Open')">▲</button>
                                <button class="ghost-btn" onclick="App.cover('tv_area','Close')">▼</button>
                            </div>
                        </div>
                        <div class="room-column" data-room="sofa">
                            <div class="room-label">Sofa</div>
                            <div class="progress-track" onclick="App.seek(event, 'sofa')" style="cursor:pointer; position:relative;">
                                <div id="prog-sofa" class="progress-fill"></div>
                                <div id="target-sofa" class="target-line"></div>
                            </div>
                            <div class="btn-group">
                                <button class="ghost-btn" onclick="App.cover('sofa','Open')">▲</button>
                                <button class="ghost-btn" onclick="App.cover('sofa','Close')">▼</button>
                            </div>
                        </div>
                        <div class="room-column" data-room="master">
                            <div class="room-label">Master</div>
                            <div class="progress-track" onclick="App.seek(event, 'master')" style="cursor:pointer; position:relative;">
                                <div id="prog-master" class="progress-fill"></div>
                                <div id="target-master" class="target-line"></div>
                            </div>
                            <div class="btn-group">
                                <button class="ghost-btn" onclick="App.cover('master','Open')">▲</button>
                                <button class="ghost-btn" onclick="App.cover('master','Close')">▼</button>
                            </div>
                        </div>
                    </div>

                    <div class="awning-bar room-column" data-room="awning">
                        <div class="awning-info">
                            <div class="awning-title">PATIO AWNING</div>
                            <div id="awning-status" class="awning-status">ONLINE</div>
                            <div id="sun-intel" class="sun-intel">☀️ Sun: Calculating...</div> 
                        </div>
                        <div class="awning-controls">
                            <button class="ghost-btn horizontal" onclick="App.cover('awning', 'close')">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                            </button>
                            <div class="awning-track" onclick="App.seek(event, 'awning', true)">
                                <div id="prog-awning" class="awning-fill"></div>
                                <div id="target-awning" class="awning-target"></div>
                            </div>
                            <button class="ghost-btn horizontal" onclick="App.cover('awning', 'open')">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                            </button>
                        </div>
                    </div>

                </div>

                <div class="tv-meta">
                    <div class="tv-power-row">
                        <button id="tv-power-btn" class="power-glow-btn" onclick="App.tv('system', 'setPowerStatus', {status: !this.classList.contains('online')})">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/>
                            </svg>
                            <span>POWER</span>
                        </button>
                        <span id="tv-status-text">OFFLINE</span>
                    </div>

                    <div class="tv-vol-ctrl">
                        <button class="vol-btn" onclick="App.tv('audio', 'setAudioVolume', {volume: '-1'})">VOL -</button>
                        <button id="tv-mute-btn" class="vol-btn" onclick="App.tv('audio', 'setAudioMute', {})">MUTE</button>
                        <button class="vol-btn" onclick="App.tv('audio', 'setAudioVolume', {volume: '+1'})">VOL +</button>
                    </div>

                    <div class="tv-media-ctrl" style="display: flex; gap: 8px; width: 100%; margin-bottom: 12px;">
                        <button class="vol-btn" onclick="App.tv('IRCC', 'Play', {})" style="background: rgba(0, 255, 170, 0.1); border-color: #00ffaa; color: #00ffaa;">▶ PLAY</button>
                        <button class="vol-btn" onclick="App.tv('IRCC', 'Pause', {})" style="background: rgba(255, 204, 0, 0.1); border-color: #ffcc00; color: #ffcc00;">⏸ PAUSE</button>
                    </div>

                    <div class="tv-apps">
                        <button class="app-btn" onclick="App.tv('appControl', 'setActiveApp', {uri: 'com.sony.dtv.com.netflix.ninja.com.netflix.ninja.MainActivity'})">Netflix</button>
                        <button class="app-btn" onclick="App.tv('appControl', 'setActiveApp', {uri: 'com.sony.dtv.com.disney.disneyplus.com.bamtechmedia.dominguez.main.MainActivity'})">Disney+</button>
                        <button class="app-btn" onclick="App.tv('appControl', 'setActiveApp', {uri: 'com.sony.dtv.com.sonypicturescore.com.sphe.bravialounge.SplashActivity'})">Sony Core</button>
                        <button class="app-btn" onclick="App.tv('appControl', 'setActiveApp', {uri: 'com.sony.dtv.com.wbd.stream.com.wbd.beam.BeamActivity'})">HBO Max</button>
                    </div>
                </div>
            </div>

    <script src="photos_data.js"></script>    
    <script src="app_v89.js"></script>
    <script src="manual_tests.js"></script>

    <!-- TEST BRANCH ONLY: visible marker so the test tablet is distinguishable from production. Do not merge to main. -->
    <style>
      #test-build-badge{position:fixed;right:10px;bottom:10px;z-index:10000;
        background:#ff0055;color:#fff;font:700 11px/1 system-ui,sans-serif;
        padding:6px 10px;border-radius:20px;letter-spacing:.08em;opacity:.92;
        pointer-events:none}
    </style>
    <div id="test-build-badge">TEST BUILD &middot; v89-test</div>
    
</body>
</html>
